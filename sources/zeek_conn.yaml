# Zeek conn.log, tab-separated (the default non-JSON output).
#
# Zeek writes a #fields header naming each column; the order below follows the
# standard conn.log layout. Real deployments should confirm against the header
# their own Zeek version emits rather than assuming it.
#
#   1 ts  2 uid  3 id.orig_h  4 id.orig_p  5 id.resp_h  6 id.resp_p
#   7 proto  8 service  9 duration  10 orig_bytes  11 resp_bytes
#   12 conn_state  13 local_orig  14 local_resp  15 missed_bytes
#   16 history  17 orig_pkts  18 orig_ip_bytes  19 resp_pkts  20 resp_ip_bytes
source: zeek_conn
format: tsv
ocsf_version: "1.5.0"
version: 1
description: Zeek network connection records.
author: human
approved_by: reference-mapping
approved_at: "2026-09-17"

rules:
  - name: connection
    ocsf_class: 4001
    fields:
      time: { from: $1, transform: epoch_seconds }
      src_endpoint.ip: $3
      src_endpoint.port: $4
      dst_endpoint.ip: $5
      dst_endpoint.port: $6
      traffic.bytes_out: $10
      traffic.bytes_in: $11
      traffic.packets: $17
      duration: { from: $9, transform: epoch_seconds }
      activity_id: 6
      severity_id: 1
      metadata.product.name: Zeek
      metadata.product.vendor_name: Zeek Project
      metadata.log_name: conn.log
