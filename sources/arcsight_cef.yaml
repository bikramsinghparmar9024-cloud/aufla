# ArcSight CEF.
#
# CEF is a published specification, so this needs no inference: the header is
# positional (1=version 2=vendor 3=product 4=device version 5=signature id
# 6=name 7=severity) and the extension section is key-value. Both are
# addressable from one mapping, which is why CEF support is a parser feature
# rather than a per-vendor mapping.
source: arcsight_cef
format: cef
ocsf_version: "1.5.0"
version: 1
description: Generic ArcSight CEF events.
author: human
approved_by: reference-mapping
approved_at: "2026-09-17"

rules:
  - name: event
    ocsf_class: 2004
    fields:
      time: { from: $rt, transform: epoch_millis }
      finding_info.title: $6
      finding_info.uid: $5
      src_endpoint.ip: $src
      dst_endpoint.ip: $dst
      src_endpoint.port: $spt
      dst_endpoint.port: $dpt
      severity_id: { from: $7, lookup: cef_severity, default: 0 }
      activity_id: 1
      metadata.product.name: $3
      metadata.product.vendor_name: $2
      metadata.log_name: cef
