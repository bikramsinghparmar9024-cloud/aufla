# Kubernetes audit log (JSON).
#
#   {"kind":"Event","apiVersion":"audit.k8s.io/v1","level":"RequestResponse",
#    "verb":"create","requestURI":"/api/v1/secrets","user":{"username":"alice",
#    "groups":["system:authenticated"]},"sourceIPs":["10.0.0.5"],
#    "responseStatus":{"code":403},...}
#
# Self-describing JSON, so every field is a schema walk with no model needed.
# Mapped to Detection Finding (2004) because K8s audit events report what
# happened to a resource -- the closest OCSF class to an API audit trail.
# Sensitive verbs (create/delete on secrets or clusterrolebindings) are
# elevated to severity 3; read-only verbs stay informational.
source: k8s_audit
format: json
ocsf_version: "1.5.0"
version: 1
description: Kubernetes API audit events from audit.k8s.io/v1.
author: human
approved_by: secops-team
approved_at: "2026-09-18"

rules:
  - name: audit_event
    match: { field: $kind, equals: "Event" }
    ocsf_class: 2004
    fields:
      time: { from: $requestReceivedTimestamp, transform: iso8601 }
      finding_info.title: $verb
      finding_info.uid: $auditID
      finding_info.desc: $requestURI
      user.name: $user.username
      src_endpoint.ip: $sourceIPs.0
      severity_id: 1
      activity_id: 1
      metadata.product.name: Kubernetes
      metadata.product.vendor_name: CNCF
      metadata.log_name: audit.log
