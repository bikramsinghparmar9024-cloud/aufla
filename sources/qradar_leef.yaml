# IBM QRadar LEEF 2.0.
#
# Like CEF, a published spec: positional header (1=version 2=vendor 3=product
# 4=device version 5=event id) with tab-delimited key=value attributes after
# it. LEEF 2.0 may declare a custom attribute delimiter in a sixth header
# field, which the parser honours.
source: qradar_leef
format: leef
ocsf_version: "1.5.0"
version: 1
description: Generic QRadar LEEF events.
author: human
approved_by: reference-mapping
approved_at: "2026-09-17"

rules:
  - name: event
    ocsf_class: 2004
    fields:
      time: { from: $devTime, transform: epoch_millis }
      finding_info.title: $cat
      finding_info.uid: $5
      src_endpoint.ip: $src
      dst_endpoint.ip: $dst
      src_endpoint.port: $srcPort
      dst_endpoint.port: $dstPort
      severity_id: { from: $sev, lookup: cef_severity, default: 0 }
      activity_id: 1
      metadata.product.name: $3
      metadata.product.vendor_name: $2
      metadata.log_name: leef
