# Real services producing real logs, for AUFLA to ingest.
#
# Everything here writes to ./logs/, which `ulpf watch` tails. No service is
# configured to send anywhere: each one simply runs and logs the way it would
# in production, and the framework reads what lands on disk. That is the point
# -- nothing about these containers is aware AUFLA exists.
#
#   docker compose -f docker/docker-compose.yml up -d
#   python -m aufla.cli watch --dir docker/logs
#
# Suricata and Zeek read a pcap rather than a live interface, because capturing
# from a host NIC needs privileges that vary by platform and would make the
# stack unrunnable for anyone evaluating it. Point them at an interface instead
# by swapping the command; the log output is identical either way.

name: aufla-sources

services:
  # --- web server: access + error logs ---------------------------------
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    restart: unless-stopped

  # --- forward proxy: access.log ---------------------------------------
  squid:
    image: ubuntu/squid:edge
    volumes:
      - ./logs/squid:/var/log/squid
    ports:
      - "3128:3128"
    restart: unless-stopped

  # --- MTA: maillog -----------------------------------------------------
  postfix:
    image: boky/postfix:latest
    environment:
      ALLOWED_SENDER_DOMAINS: corp.test
      # Log to a file as well as stdout so the tailer has something to read.
      POSTFIX_maillog_file: /var/log/postfix/maillog
    volumes:
      - ./logs/postfix:/var/log/postfix
    restart: unless-stopped

  # --- SSH: auth.log ----------------------------------------------------
  # Deliberately reachable so failed-login attempts are genuine. Root login is
  # disabled and no password is set: this exists to generate refusals.
  sshd:
    image: linuxserver/openssh-server:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      PASSWORD_ACCESS: "false"
      USER_NAME: demo
      LOG_STDOUT: "false"
    volumes:
      - ./logs/ssh:/config/logs/openssh
    ports:
      - "2222:2222"
    restart: unless-stopped

  # --- IDS: eve.json ----------------------------------------------------
  suricata:
    image: jasonish/suricata:latest
    command: >
      -r /pcap/sample.pcap
      -l /var/log/suricata
      --set outputs.1.eve-log.filetype=regular
    volumes:
      - ./logs/suricata:/var/log/suricata
      - ./pcap:/pcap:ro
    restart: "no"

  # --- network monitor: conn.log ----------------------------------------
  zeek:
    image: zeek/zeek:latest
    working_dir: /var/log/zeek
    command: ["zeek", "-r", "/pcap/sample.pcap", "LogAscii::use_json=F"]
    volumes:
      - ./logs/zeek:/var/log/zeek
      - ./pcap:/pcap:ro
    restart: "no"

  # --- packet filter: kernel log ----------------------------------------
  # NET_ADMIN is required to install rules at all. The container filters only
  # its own namespace, so it cannot affect the host's networking.
  nftables:
    image: alpine:3.20
    cap_add:
      - NET_ADMIN
    volumes:
      - ./logs/netfilter:/var/log/netfilter
      - ./conf/nftables.sh:/nftables.sh:ro
    command: ["sh", "/nftables.sh"]
    restart: unless-stopped
