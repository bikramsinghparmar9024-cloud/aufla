# Combined log format, written to a file rather than stdout so the tailer has
# something to follow. The default nginx image symlinks these to /dev/stdout,
# which is convenient for `docker logs` and useless for anything reading disk.

log_format combined_ext '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

server {
    listen       80;
    server_name  _;

    access_log  /var/log/nginx/access.log  combined_ext;
    error_log   /var/log/nginx/error.log   warn;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # Exists to be requested and fail, so the error log is not empty.
    location /missing-on-purpose {
        alias /usr/share/nginx/html/definitely-not-here;
    }
}
